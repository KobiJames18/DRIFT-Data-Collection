<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login DRI-FT</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../register.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Medium-sized input fields, scoped to the admin login form only */
  #login-form input[type="email"],
  #login-form input[type="password"],
  #login-form input[type="text"] {
    padding: 15px 17px;
    font-size: 15px;
  }

  .password-wrap {
    position: relative;
  }

  .password-wrap input {
    width: 100%;
    padding-right: 52px !important;
  }

  .toggle-password {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--gray);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 8px 10px;
  }

  .toggle-password:hover {
    color: var(--white);
  }
</style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-mark">
    <img src="../images/drift header logo.jpg" alt="DRIFT" class="nav-logo">
  </a>
</nav>

<section class="reg-hero">
  <div class="eyebrow">Staff Only</div>
  <h1 class="reg-title">Admin Login</h1>
  <p class="reg-sub">Sign in to manage DRI-FT registrations, check-ins, and volunteers.</p>
</section>

<section class="reg-form-section">
  <form id="login-form" class="reg-form" novalidate>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="DRI-FT@email.com" required>
      <span class="error-msg" data-for="email">Please enter a valid email address.</span>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" placeholder="••••••••" required>
        <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password">Show</button>
      </div>
      <span class="error-msg" data-for="password">Please enter your password.</span>
    </div>

    <button type="submit" class="btn submit-btn">Sign In</button>

    <p class="form-note" id="login-error" style="color: var(--red); display: none;"></p>
  </form>
</section>

<footer>
  DRI-FT © 2027 All Rights Reserved
</footer>

<script src="admin.login.js"></script>

</body>
</html>
