<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRI-FT Scanner</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="admin.dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<nav>
  <span class="nav-mark mono" style="color: var(--white); font-size: 14px; letter-spacing: 0.1em;">DRI-FT SCANNER</span>
  <div class="nav-links">
    <span id="staff-email" class="mono admin-email-tag"></span>
    <a href="#" id="logout-link">Log Out</a>
  </div>
</nav>

<main class="dash-wrap" id="scanner-main" hidden style="padding-top: 110px; max-width: 500px;">
  <h1 class="dash-title" style="font-size: 28px; margin-bottom: 24px; text-align: center;">Door Check-In</h1>

  <div class="checkin-search-row">
    <input type="text" id="checkin-search-input" class="search-box" placeholder="Enter registration ID">
    <button class="btn" id="checkin-search-btn">Find</button>
  </div>
  <div class="checkin-scan-row">
    <button class="btn btn-ghost" id="checkin-scan-toggle">📷 Scan QR Code Instead</button>
  </div>
  <div id="qr-reader" hidden></div>
  <div id="checkin-result"></div>
</main>

<script src="scanner.js"></script>
</body>
</html>
